<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacting us</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="first_css.css">
</head>


<body>
  <h1 class="contact-header">
    Contact Us, If you have any questions or feedback, feel free to reach out!
  </h1>
<form id="contactForm">
  <label for="fName">First Name*:</label>
  <input type="text" id="fName" required><br>

  <label for="lName">Last Name*:</label>
  <input type="text" id="lName" required><br>

  <label for="message">Message:</label>
  <input type="text" id="message"><br>

  <label for="email">Email*:</label>
  <input type="email" id="email" required><br>

  <input type="checkbox" id="Agree" required>
  <label for="Agree">Agree to Terms of Service*</label><br>

  <button id="mySubmit" type="submit">Submit</button>
</form>

<script>
  document.getElementById("contactForm").addEventListener("submit", function(event) {
    event.preventDefault();
    alert("Form submitted!");
  });
</script>
  <p class="contact-text">
    We would love to hear from you! Please don't hesitate to contact us with any questions or feedback.
  </p>
</body>
